[package]
name = "brush-rerun"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[features]
default = ["rerun"]
# Log training to rerun.io. Without it, `VisualizeTools` is a no-op and the
# rerun SDK (and its dependencies) is not linked.
rerun = ["dep:rerun", "dep:glam", "dep:image", "dep:log"]

[dependencies]
clap.workspace = true
anyhow.workspace = true
serde.workspace = true

# These are needed for visualize_tools API (even noop on WASM)
burn = { workspace = true, features = ["autodiff"] }
brush-render.path = "../brush-render"
brush-train.path = "../brush-train"
brush-dataset.path = "../brush-dataset"

tokio.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rerun = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
image = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true
