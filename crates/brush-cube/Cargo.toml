[package]
name = "brush-cube"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
# `wgpu` also wires up burn-backend's DeviceOps impl for WgpuDevice — without
# it, building this crate outside the full workspace (e.g. `cargo test -p
# lpips`) fails inside burn-wgpu.
burn = { workspace = true, features = ["wgpu"] }
burn-cubecl.workspace = true
burn-wgpu.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
log.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
wasm-logger = "0.2"

[lints]
workspace = true

# Compile kernels to MSL rather than going through wgpu's WGSL frontend.
# On by default on macOS, so a plain `cargo run` uses the native path.
#
# Opt out with `RUSTFLAGS='--cfg brush_no_metal'`, which CI does. burn
# switches bool storage to u8 as soon as this is on, but cubecl picks the
# shader compiler at runtime and wants MTLGPUFamily::Apple7 plus a Metal
# compiler >= 3.2. A GPU failing that check (CI's paravirtual device, say)
# falls back to WGSL, which has no u8 type, so every kernel touching a bool
# fails to compile. Cargo evaluates this cfg from RUSTFLAGS, so the opt-out
# removes the dependency feature entirely rather than patching over it.
[target.'cfg(all(target_os = "macos", not(brush_no_metal)))'.dependencies]
burn-wgpu = { workspace = true, features = ["metal"] }
