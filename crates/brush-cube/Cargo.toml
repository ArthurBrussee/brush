[package]
name = "brush-cube"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
# `wgpu` also wires up burn-backend's DeviceOps impl for WgpuDevice — without
# it, building this crate outside the full workspace (e.g. `cargo test -p
# lpips`) fails inside burn-wgpu.
burn = { workspace = true, features = ["wgpu"] }
burn-cubecl.workspace = true
burn-wgpu.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
log.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
wasm-logger = "0.2"

[lints]
workspace = true

# On macOS compile kernels to MSL rather than going through wgpu's WGSL
# frontend. This has to be target-gated: the feature turns on cubecl's msl
# path for the whole graph, and on other platforms that leaks into WGSL
# codegen (it starts emitting `vec4<u8>`, which WGSL has no such type for).
[target.'cfg(target_os = "macos")'.dependencies]
burn-wgpu = { workspace = true, features = ["metal"] }
