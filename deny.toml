# https://github.com/EmbarkStudios/cargo-deny
#
# cargo-deny checks the dependency tree for copy-left licenses,
# duplicate dependencies, and rustsec advisories (https://rustsec.org/advisories).
#
# Install: `cargo install cargo-deny`
# Check: `cargo deny check`.

# Note: running just `cargo deny check` without a `--target` can result in
# false positives due to https://github.com/EmbarkStudios/cargo-deny/issues/324
[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "wasm32-unknown-unknown" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-linux-android" },
]
all-features = true
# One-off LPIPS weight-conversion tool - don't really mind deps of it and
# it pulls in a ton of stuff through the pytorch feature.
exclude = ["lpips-convert"]

[advisories]
version = 2
ignore = [
    # Paste is unmaintained, used by Cube and rerun, wait for them to upgrade.
    "RUSTSEC-2024-0436",
    # ttf-parser is unmaintained, used transitively by winit.
    "RUSTSEC-2026-0192",
]

[bans]
# Some duplicates are resolved by pinning rather than skipping, so the pin has
# to be re-applied after a bare `cargo update`. Right now that is one crate:
# `cargo update -p flate2 --precise 1.1.9`, because 1.1.10 moves to
# miniz_oxide 0.9 while png, exr and backtrace are still on 0.8, which lands a
# second copy in the tree.
multiple-versions = "deny"
deny = [
    { name = "openssl-sys", reason = "Use rustls" },
    { name = "openssl", reason = "Use rustls" },
]

skip = [
    # common small deps.
    { name = "bitflags" },
    { name = 'itertools' },
    { name = 'getrandom' },
    { name = 'rand' },
    { name = 'rand_core' },
    { name = 'env_filter' },

    { name = 'darling_macro' },
    { name = 'darling' },
    { name = 'darling_core' },

    { name = 'cpufeatures' },

    { name = 'thiserror' },
    { name = 'thiserror-impl' },

    # syn 2 -> 3 ecosystem transition (async-trait is on 3, most derives on 2).
    { name = 'syn' },

    # burn pins spin 0.11, cubecl pins 0.12. Remove once they agree.
    { name = 'spin' },

    # pliron (via cubecl) is on downcast-rs 2, wayland-backend still on 1.
    { name = 'downcast-rs' },

    # rerun's re_auth is on base64 0.23, arrow/reqwest/tonic still on 0.22.
    { name = 'base64' },

    # eframe 0.36 moved to pollster 1.0, rfd (latest 0.17.2) still on 0.4.
    { name = 'pollster' },

    # Other
    { name = "core-foundation" },     # Egui has two?
    { name = 'windows_x86_64_msvc' }, # Old version from winit.
    { name = 'windows_x86_64_gnu' },  # Old version from winit.
    { name = 'windows-targets' },     # Old version from winit.
    { name = 'windows-sys' },         # Old version from winit.

    { name = 'rustix' },        # Winit & clap
    { name = 'linux-raw-sys' }, # Winit & clap

    { name = 'block2' },           # eframe & rfd
    { name = 'objc2' },            # eframe & rfd
    { name = 'objc2-app-kit' },    # eframe & rfd
    { name = 'objc2-foundation' }, # eframe & rfd

    { name = 'hashbrown' },
    { name = "rustc-hash" },
    { name = "smithay-client-toolkit" },
    { name = "foldhash" },
    { name = "calloop-wayland-source" },
    { name = "calloop" },
    { name = "convert_case" },
    { name = "console" },
    { name = "jni-sys" },
    { name = "wasm-streams" },
]

[licenses]
version = 2
private = { ignore = true }
confidence-threshold = 0.93 # We want really high confidence when inferring licenses from text
allow = [
    "Apache-2.0 WITH LLVM-exception", # https://spdx.org/licenses/LLVM-exception.html
    "Apache-2.0",                     # https://tldrlegal.com/license/apache-license-2.0-(apache-2.0)
    "BSD-2-Clause",                   # https://tldrlegal.com/license/bsd-2-clause-license-(freebsd)
    "BSD-3-Clause",                   # https://tldrlegal.com/license/bsd-3-clause-license-(revised)
    "BSL-1.0",                        # https://tldrlegal.com/license/boost-software-license-1.0-explained
    "CC0-1.0",                        # https://creativecommons.org/publicdomain/zero/1.0/
    "ISC",                            # https://www.tldrlegal.com/license/isc-license
    "MIT",                            # https://tldrlegal.com/license/mit-license
    "MPL-2.0",                        # https://www.mozilla.org/en-US/MPL/2.0/FAQ/ - see Q11. Used by webpki-roots on Linux.
    "Zlib",                           # https://tldrlegal.com/license/zlib-libpng-license-(zlib)
    "Unlicense",                      # https://www.tldrlegal.com/license/unlicense
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0)"
license-files = []

[sources]
unknown-registry = "deny"
unknown-git = "allow"
