on:
  pull_request:
  push:
    branches: ["main"]

name: Rust

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt-crank-check:
    name: Format + check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev # libgtk-3-dev is used by rfd
          version: 1.0
          execute_install_scripts: true

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2"
          shared-key: "brush"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # clippy subsumes `cargo check` (same lints plus more), so no separate
      # check step for the all-features config.
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: check --no-default-features
        run: cargo check --locked --workspace --no-default-features --all-targets

      # `--document-private-items` is a superset of the public-docs run.
      - name: cargo doc
        run: cargo doc --workspace --document-private-items --no-deps --all-features

  # ---------------------------------------------------------------------------

  wasm-check:
    name: Check wasm32
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2"
          shared-key: "brush-wasm"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true

      # The browser build (brush-app / brush-js cdylibs) is only compiled for
      # wasm32; the host-only jobs above never exercise it. Check it here so a
      # wasm-only break can't ship green.
      - name: check wasm32 (browser crates)
        run: cargo check --locked -p brush-app -p brush-js --lib --target wasm32-unknown-unknown

  # ---------------------------------------------------------------------------

  # One job for all targets: deny.toml's [graph] targets list drives the
  # resolution, so no per-target matrix is needed.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.95.0"
          log-level: error
          command: check

  # ---------------------------------------------------------------------------

  tests:
    name: Run tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2"
          shared-key: "brush"
          cache-workspace-crates: true
          cache-on-failure: true

      # Doc-tests are included in the default `cargo test` target set, so no
      # separate --doc step is needed.
      - name: Run tests
        # Not --all-features: `brush-cube/metal` is opt-in and would be swept
        # in. CI runners only have a paravirtual GPU, which cannot compile
        # MSL, and enabling the feature switches burn to u8 bool storage that
        # the WGSL fallback then chokes on. debug-validation cascades from
        # brush-app to render/train/process.
        run: cargo test --all --features brush-app/debug-validation
